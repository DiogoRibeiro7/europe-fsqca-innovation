# Directional expectations for the intermediate solution.
#
# An intermediate solution is only defensible if the expectations that generate
# it were fixed in advance from theory. Two rules govern this file:
#
#   1. Do not infer an expectation from an observed truth table.
#   2. Do not choose a direction because it produces a simpler solution.
#
# Where theory does not support a direction, the honest entry is
# `unconstrained`. An unconstrained condition places no restriction on the
# counterfactual, so its removal from a term is always admissible. Marking a
# condition `unconstrained` costs parsimony and buys honesty; that is the
# correct trade.
#
# `polarity` takes `present`, `absent` or `unconstrained`. It states which value
# of the condition is expected to contribute to high innovation.
#
# `status` takes:
#   theoretical            - anchored to a specific published argument
#   provisional            - asserted without a specific anchor
#   blocked_on_measurement - the construct is not yet defined well enough to
#                            support any directional claim
#
# The canonical intermediate solution is produced by the CRAN QCA package from
# these expectations. The Python implementation only checks the resulting
# Boolean structure. See docs/qca_engine_policy.md.
#
# Bibliography keys refer to paper/references.bib.

outcome: INN

expectations:
  DIG:
    polarity: present
    justification: >-
      Digital and technological capability is treated as an enabling capability
      for innovation. Information technology is argued to be complementary to
      workplace reorganisation and to the introduction of new products and
      services, so its presence lowers the cost of search, recombination and
      prototyping rather than acting independently of them. The counterfactual
      that innovation occurs in its absence is therefore a difficult one and is
      not assumed.
    basis: >-
      Bresnahan, Brynjolfsson and Hitt (2002) find complementarities between
      information technology, organisational change and new products and
      services in firm-level factor demand and productivity.
    references: [bresnahan2002]
    status: theoretical

  HC:
    polarity: present
    justification: >-
      Recognising, assimilating and applying external knowledge requires prior
      related knowledge held by the workforce. A firm without that stock cannot
      exploit the technological opportunities available to it, so the absence of
      human capital is not expected to produce high innovation.
    basis: >-
      Cohen and Levinthal (1990) define absorptive capacity as a function of
      prior related knowledge and argue that it conditions a firm's ability to
      exploit external technical information.
    references: [cohen1990]
    status: theoretical

  FIN:
    polarity: present
    justification: >-
      Innovation expenditure is uncertain, largely intangible and hard to
      collateralise, which makes external finance costly relative to internal
      funds and leaves financially constrained firms unable to sustain it.
      Financing capability is therefore expected to contribute when present.
    basis: >-
      Hall and Lerner (2010) survey the evidence that R&D faces a funding gap
      arising from asymmetric information and the intangibility of the assets
      created. Ayyagari, Demirguc-Kunt and Maksimovic (2011) find external
      finance associated with firm innovation using Enterprise Survey data,
      which is the same instrument family analysed here.
    references: [hall2010, ayyagari2011]
    status: theoretical

  INT:
    polarity: present
    justification: >-
      Exposure to international markets is expected to raise both the return to
      innovation, through market size, and the pressure to innovate, through
      competition, and to expose the firm to knowledge unavailable domestically.
    basis: >-
      Salomon and Shaver (2005) find that exporting is followed by increases in
      firm innovation, consistent with learning by exporting rather than with
      selection alone.
    references: [salomon2005]
    status: theoretical

  EXTK:
    polarity: unconstrained
    justification: >-
      No direction is asserted. The construct currently bundles foreign
      ownership, international certification and technology licensing, which are
      a governance structure, a quality-assurance practice and a knowledge
      channel respectively. Each has its own expected sign and they need not
      agree. A directional claim about an object that has not been defined would
      not be a claim, so the counterfactual is left unconstrained until the
      measurement model resolves which channel the condition captures.
    basis: >-
      Unresolved measurement concern recorded in configs/wbes_variable_map.yml.
      This entry is expected to become directional once the construct is split
      or narrowed.
    references: []
    status: blocked_on_measurement

  MGT:
    polarity: present
    justification: >-
      Structured management practices, specifically systematic performance
      monitoring, target setting and incentives, are expected to support
      innovation by making problems visible and by allocating effort to them.
      Applies only to the restricted management extension sample.
    basis: >-
      Bloom and Van Reenen (2007) measure management practices across firms and
      countries on exactly these dimensions and find them associated with firm
      performance, with wide and persistent variation across countries.
    references: [bloom2007]
    status: theoretical

# Five expectations are anchored to specific published arguments. EXTK remains
# blocked because its construct is not yet defined.
#
# The register is NOT frozen. Anchoring the theory was the part that could be
# completed without the data; freezing additionally requires that the variable
# mapping be verified, because an expectation about a construct that has not
# been operationalised cannot be checked against what was actually measured.
review:
  frozen: false
  freeze_condition: >-
    EXTK is resolved or dropped, the variable mapping is verified against the
    real EU-27 releases, and the freeze is recorded before the first canonical
    truth table is inspected.
  outstanding:
    - EXTK construct is unresolved, so no direction can be asserted for it
    - variable mapping is unverified, so no expectation can be checked against
      an operationalised construct
