# Synthetic demonstration configuration. Software validation only.
# Anchors, thresholds and directional expectations here are illustrative and
# carry no substantive meaning.
status: research
case_id: firm_id
country_column: country
regions_file: configs/regions.yml
primary_region_scheme: macro3
design_columns: [sector, size_class, n_employees]

survey:
  weight_column: sampling_weight
  strata_column: stratum
  primary_estimand: unweighted
  estimands: [unweighted, firm_population, equal_country]

timing:
  year_column: survey_year
  reference_period_years: 3
  periods:
    pre_covid: [2018, 2019]
    covid: [2020, 2021, 2022]

conditions:
  DIG:
    source: digital_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}
  HC:
    source: human_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}
  FIN:
    source: finance_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}
  INT:
    source: international_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}
  MGT:
    source: management_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}
  EXTK:
    source: external_knowledge_raw
    direction: present
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}

outcome:
  INN:
    source: innovation_raw
    anchors: {exclusion: 30, crossover: 50, inclusion: 70, idm: 0.95}

# The primary sample keeps every establishment from five workers upwards. The
# management extension is restricted to the establishments that are actually
# asked the management-practice questions, which is a different population.
samples:
  primary:
    label: primary
    primary: true
    description: Broad EU coverage without the management condition.
    conditions: [DIG, HC, FIN, INT, EXTK]
    filters:
      - column: n_employees
        min: 5
        description: establishments with at least five workers
  management:
    label: management_20plus
    description: Six-condition model on establishments asked the management module.
    conditions: [DIG, HC, FIN, INT, EXTK, MGT]
    filters:
      - column: n_employees
        min: 20
        description: establishments with at least twenty workers
      - column: management_raw
        require_non_missing: true
        description: complete management-practice answers

truth_table:
  frequency_cutoff: 8
  consistency_cutoff: 0.80
  pri_cutoff: 0.50
  frequency_basis: cases

robustness:
  enabled: true
  consistency_cutoffs: [0.78, 0.80, 0.82, 0.85]
  pri_cutoffs: [0.50, 0.55, 0.60]
  frequency_cutoffs: [5, 8, 12]
  anchor_shift_proportions: [-0.05, 0.0, 0.05]
  bootstrap_replicates: 25
  portability_bootstrap_replicates: 25
  portability_discovery_replicates: 10
  alternative_region_scheme: eu4_robustness
  random_seed: 42
