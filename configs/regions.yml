# Primary analytical taxonomy. This is a research classification, not a claim that
# these are official geographic regions. It is designed to compare mature
# Northern/Western systems, Southern Europe, and Central/Eastern post-transition systems.
macro3:
  north_west:
    - Austria
    - Belgium
    - Denmark
    - Finland
    - France
    - Germany
    - Ireland
    - Luxembourg
    - Netherlands
    - Sweden
  south:
    - Cyprus
    - Greece
    - Italy
    - Malta
    - Portugal
    - Spain
  central_east:
    - Bulgaria
    - Croatia
    - Czechia
    - Estonia
    - Hungary
    - Latvia
    - Lithuania
    - Poland
    - Romania
    - Slovakia
    - Slovenia

