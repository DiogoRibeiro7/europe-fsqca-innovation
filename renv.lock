  "Packages": {
    "QCA": {
      "Package": "QCA",
      "Version": "3.25",
      "Source": "Repository",
      "SystemRequirements": "POSIX threads (optional)",
      "Title": "Qualitative Comparative Analysis",
      "Authors@R": "c( person(given = \"Adrian\", family = \"Dusa\", role = c(\"aut\", \"cre\", \"cph\"), email = \"dusa.adrian@unibuc.ro\", comment = c(ORCID = \"0000-0002-3525-9253\")), person(\"Ciprian\", \"Paduraru\", role = \"ctb\", email = \"ciprian.paduraru@fmi.unibuc.ro\", comment = c(ORCID = \"0000-0002-4518-374X\")), person(\"Alrik\", \"Thiem\", role = \"aut\", comment = \"from version 1.0-0 up to version 1.1-3\") )",
      "URL": "https://github.com/dusadrian/QCA",
      "BugReports": "https://github.com/dusadrian/QCA/issues",
      "Depends": [
        "R (>= 3.6.0)",
        "admisc (> 0.39)"
      ],
      "LazyData": "yes",
      "Imports": [
        "methods",
        "declared",
        "venn"
      ],
      "Description": "An extensive set of functions to perform Qualitative Comparative Analysis: crisp sets ('csQCA'), temporal ('tQCA'), multi-value ('mvQCA') and fuzzy sets ('fsQCA'). 'QCA' is a methodology that bridges the qualitative and quantitative divide in social science research. It uses a Boolean minimization algorithm, resulting in a minimal causal configuration associated with a given phenomenon.",
      "License": "GPL (>= 3)",
      "Encoding": "UTF-8",
      "NeedsCompilation": "yes",
      "Author": "Adrian Dusa [aut, cre, cph] (ORCID: <https://orcid.org/0000-0002-3525-9253>), Ciprian Paduraru [ctb] (ORCID: <https://orcid.org/0000-0002-4518-374X>), Alrik Thiem [aut] (from version 1.0-0 up to version 1.1-3)",
      "Maintainer": "Adrian Dusa <dusa.adrian@unibuc.ro>",
      "Repository": "CRAN"
    },
    "admisc": {
      "Package": "admisc",
      "Version": "0.40",
      "Source": "Repository",
      "SystemRequirements": "OpenMP (optional)",
      "Title": "Adrian Dusa's Miscellaneous",
      "Authors@R": "person( given = \"Adrian\", family = \"Dusa\", role = c(\"aut\", \"cre\", \"cph\"), email = \"dusa.adrian@unibuc.ro\", comment = c(ORCID = \"0000-0002-3525-9253\"))",
      "URL": "https://github.com/dusadrian/admisc",
      "BugReports": "https://github.com/dusadrian/admisc/issues",
      "Depends": [
        "R (>= 3.5.0)"
      ],
      "Imports": [
        "methods"
      ],
      "Suggests": [
        "QCA (>= 3.7)"
      ],
      "Description": "Contains functions used across packages 'DDIwR', 'QCA' and 'venn'. Interprets and translates, factorizes and negates SOP - Sum of Products expressions, for both binary and multi-value crisp sets, and extracts information (set names, set values) from those expressions. Other functions perform various other checks if possibly numeric (even if all numbers reside in a character vector) and coerce to numeric, or check if the numbers are whole. It also offers, among many others, a highly versatile recoding routine and some more flexible alternatives to the base functions 'with()' and 'within()'. SOP simplification functions in this package use related minimization from package 'QCA', which is recommended to be installed despite not being listed in the Imports field, due to circular dependency issues.",
      "License": "GPL (>= 3)",
      "Encoding": "UTF-8",
      "RoxygenNote": "7.3.3",
      "NeedsCompilation": "yes",
      "Author": "Adrian Dusa [aut, cre, cph] (ORCID: <https://orcid.org/0000-0002-3525-9253>)",
      "Maintainer": "Adrian Dusa <dusa.adrian@unibuc.ro>",
      "Repository": "CRAN"
    },
    "declared": {
      "Package": "declared",
      "Version": "0.26",
      "Source": "Repository",
      "Title": "Functions for Declared Missing Values",
      "Authors@R": "c( person( \"Adrian\", \"Dusa\", email = \"dusa.adrian@unibuc.ro\", role = c(\"aut\", \"cre\", \"cph\"), comment = c(ORCID = \"0000-0002-3525-9253\") ) )",
      "URL": "https://github.com/dusadrian/declared",
      "BugReports": "https://github.com/dusadrian/declared/issues",
      "Description": "A zero dependency package containing functions to declare labels and missing values, coupled with associated functions to create (weighted) tables of frequencies and various other summary measures.  Some of the base functions have been rewritten to make use of the specific  information about the missing values, most importantly to distinguish between empty NA and declared NA values. Some functions have similar functionality with the corresponding ones from packages \"haven\" and \"labelled\". The aim is to ensure as much compatibility as possible with these packages, while offering an alternative in the objects of class \"declared\".",
      "License": "GPL (>= 3)",
      "Language": "en-US",
      "Encoding": "UTF-8",
      "NeedsCompilation": "yes",
      "Author": "Adrian Dusa [aut, cre, cph] (ORCID: <https://orcid.org/0000-0002-3525-9253>)",
      "Maintainer": "Adrian Dusa <dusa.adrian@unibuc.ro>",
      "Repository": "CRAN"
    },
    "venn": {
      "Package": "venn",
      "Version": "1.13",
      "Source": "Repository",
      "Title": "Draw Venn Diagrams",
      "Authors@R": "person(given = \"Adrian\", family = \"Dusa\", role = c(\"aut\", \"cre\", \"cph\"), email = \"dusa.adrian@unibuc.ro\", comment = c(ORCID = \"0000-0002-3525-9253\"))",
      "Depends": [
        "R (>= 3.5.0)"
      ],
      "Imports": [
        "admisc (>= 0.33)"
      ],
      "Suggests": [
        "QCA (>= 3.9)",
        "ggplot2",
        "ggpolypath"
      ],
      "Description": "A close to zero dependency package to draw and display Venn diagrams up to 7 sets, and any Boolean union of set intersections.",
      "License": "GPL (>= 3)",
      "URL": "https://github.com/dusadrian/venn",
      "BugReports": "https://github.com/dusadrian/venn/issues",
      "NeedsCompilation": "no",
      "Author": "Adrian Dusa [aut, cre, cph] (ORCID: <https://orcid.org/0000-0002-3525-9253>)",
      "Maintainer": "Adrian Dusa <dusa.adrian@unibuc.ro>",
      "Repository": "CRAN"
    },
