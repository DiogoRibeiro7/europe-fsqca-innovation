name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run mypy src tests
      - run: poetry run python -m euro_fsqca.cli validate-spec --spec configs/research_spec.yml
      - run: poetry run pytest

  r-canonical:
    name: canonical R engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: snok/install-poetry@v1
      - run: poetry install
      # Produce a calibrated table, then run the canonical engine over it. This
      # is a reproducibility smoke test: synthetic input, real R execution.
      - run: |
          poetry run python -m euro_fsqca.cli demo --output data/processed/demo_raw.csv --n 1500 --seed 42
          poetry run python -m euro_fsqca.cli run             --input data/processed/demo_raw.csv             --config configs/analysis.demo.yml             --output-dir results/demo             --unsafe-development-run
      - run: |
          Rscript r/qca_crosscheck.R             results/demo/calibrated_memberships.csv             configs/analysis.demo.yml             results/demo/r_validation/europe             INN
      - name: Verify the canonical engine produced structured output
        run: |
          test -s results/demo/r_validation/europe/solution_terms.csv
          test -s results/demo/r_validation/europe/solutions.csv
          test -s results/demo/r_validation/europe/truth_table.csv
      - run: poetry run python scripts/run_parity.py --results results/demo --config configs/analysis.demo.yml --skip-r --r-output results/demo/r_validation/europe || true
